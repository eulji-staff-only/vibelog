spring:
  application:
    name: vibelog
  datasource:
    # 기본값은 sql/00-create-database.sql 로 만든 로컬 DB 계정이다.
    # 내 MySQL 계정이 다르면 이 파일을 고치지 말고 환경 변수(DB_URL, DB_USERNAME, DB_PASSWORD)로 덮어쓴다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/vibelog}
    username: ${DB_USERNAME:vibelog}
    password: ${DB_PASSWORD:vibelog}
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      # 테이블은 DB 팀의 테이블 정의서를 기준으로 SQL 스크립트로 만든다. (Entity로 테이블을 만들지 않는다)
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # 파일 규칙(장당 5MB)은 FileStorage 가 검사해 INVALID_FILE 로 안내한다 (#79).
      # 이 값을 넘어도 GlobalExceptionHandler 가 같은 안내를 보내지만, 서버가 나머지를 읽지 않고 연결을 끊는다.
      # 그래서 흔한 크기의 사진(5~20MB)은 끝까지 읽고 안내하도록 넉넉히 둔다 (게시글 3장 = 15MB).
      max-file-size: 20MB
      max-request-size: 30MB

server:
  servlet:
    session:
      # 2시간 동안 요청이 없으면 로그인이 풀린다 (PL-USR-006). "로그인 유지"를 체크했으면 쿠키로 14일 동안 다시 로그인된다
      timeout: 2h

vibelog:
  upload:
    # 업로드 파일 저장 폴더 (#79). 배포 서버에서는 환경 변수 UPLOAD_DIR 로 바꾼다
    dir: ${UPLOAD_DIR:uploads}

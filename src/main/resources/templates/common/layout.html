<!--
  common/layout.html
  모든 화면이 함께 쓰는 헤더 · 푸터 fragment.
  사용법: th:replace="~{common/layout :: header}" / "~{common/layout :: footer}"
  로그인 상태별 메뉴(1-5 회원·운영자 메뉴)는 sec:authorize 로 나눈다 (#132, README "로그인 약속").
  767px 이하에서는 메뉴를 접고 햄버거 버튼으로 펼친다 (설계서 7장, #153). 펼치기는 static/js/header.js 가 한다.
  닉네임은 이 fragment 를 쓰는 화면의 Controller가 모델에 담은 "loginNickname" 을 쓰고,
  없으면(아직 연결 안 한 화면) 기본 문구로 보여준다.
  공지 배너(1-5, #186): 기간 안의 배너 공지 1개 "noticeBanner" 를 MessageHeaderAdvice 가 넣는다. 누르면 U-26 (비회원은 로그인으로).
  알림(1-5, #185): 안 읽은 수 "unreadNotificationCount" 는 message 영역 MessageHeaderAdvice 가 모든 화면에 넣는다.
  드롭다운 목록·모두 읽음은 header.js 가 /api/notifications 를 부른다 (CSRF 토큰은 data 속성으로 넘긴다).
-->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>

<header th:fragment="header" class="vl-header" data-header>
    <a class="vl-banner" th:if="${noticeBanner != null}" th:href="@{/notices/{id}(id=${noticeBanner.noticeId()})}">
        <span class="vl-banner__label">공지</span><span class="vl-banner__title" th:text="${noticeBanner.title()}">공지 제목</span>
    </a>
    <div class="vl-content vl-header__inner">
        <a class="vl-header__logo" href="/">바이브로그</a>
        <!-- 모바일에서만 보인다 -->
        <button type="button" class="vl-header__toggle" aria-expanded="false" aria-controls="vl-header-menu" aria-label="메뉴 열기" data-header-toggle>
            <span class="vl-header__toggle-bar" aria-hidden="true"></span>
        </button>
        <!-- 데스크톱에서는 감싸지 않은 것처럼 보이고(display: contents), 모바일에서는 버튼으로 펼친다 -->
        <div class="vl-header__menu" id="vl-header-menu">
        <nav class="vl-header__nav">
            <a href="/courses">코스</a>
            <a href="/community">커뮤니티</a>
            <a href="/notices">공지사항</a>
            <a href="/contests/current">콘테스트</a>
        </nav>
        <form class="vl-header__search" action="/courses" method="get">
            <input type="search" name="q" placeholder="코스 검색" aria-label="코스 검색">
        </form>

        <div class="vl-header__auth" sec:authorize="isAnonymous()">
            <a class="is-text" href="/login">로그인</a>
            <a class="is-primary" href="/signup">회원가입</a>
        </div>

        <div class="vl-header__member" sec:authorize="isAuthenticated()">
            <span class="vl-header__nickname" th:text="${loginNickname} ?: '회원'">닉네임</span>
            <a class="is-text" href="/my/learning">내 학습</a>
            <a class="is-text" href="/messages">쪽지</a>
            <a class="is-text" href="/mypage">마이페이지</a>
            <a class="is-text" href="/admin" sec:authorize="hasRole('ADMIN')">백오피스</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="is-text vl-header__logout-btn">로그아웃</button>
            </form>
            <div class="vl-notify" data-notify th:attr="data-csrf-token=${_csrf?.token},data-csrf-header=${_csrf?.headerName}">
                <button type="button" class="vl-notify__btn" aria-expanded="false" aria-controls="vl-notify-panel" data-notify-toggle
                        th:aria-label="${unreadNotificationCount != null and unreadNotificationCount > 0} ? |알림, 안 읽은 알림 ${unreadNotificationCount}개| : '알림'">
                    <svg class="vl-notify__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/>
                    </svg>
                    <span class="vl-notify__count" aria-hidden="true" data-notify-count
                          th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                          th:text="${unreadNotificationCount > 99} ? '99+' : ${unreadNotificationCount}">3</span>
                </button>
                <div class="vl-notify__panel" id="vl-notify-panel" hidden data-notify-panel>
                    <div class="vl-notify__head">
                        <strong>알림</strong>
                        <button type="button" class="vl-notify__read-all" data-notify-read-all>모두 읽음</button>
                    </div>
                    <ul class="vl-notify__list" data-notify-list></ul>
                    <p class="vl-notify__empty" hidden data-notify-empty>알림이 없습니다</p>
                    <button type="button" class="vl-notify__more" hidden data-notify-more>더 보기</button>
                </div>
            </div>
        </div>
        </div>
    </div>
    <script th:src="@{/js/header.js}" defer></script>
</header>

<footer th:fragment="footer" class="vl-footer">
    <div class="vl-footer__inner">
        <p>바이브로그 — 바이브코딩 학습 플랫폼</p>
        <p>문의 <a href="mailto:support@vibelog.example">support@vibelog.example</a></p>
    </div>
</footer>

</body>
</html>

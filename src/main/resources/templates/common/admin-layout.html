<!--
  common/admin-layout.html
  운영자 화면(백오피스, A-01~A-08)이 같이 쓰는 왼쪽 메뉴 fragment (#13 common/layout.html 과 같은 방식).
  사용법: th:replace="~{common/admin-layout :: sidebar('dashboard')}"
  active 로 지금 보고 있는 메뉴를 강조한다(1-5 "지금 보고 있는 메뉴는 강조 표시"): dashboard | tracks | categories | courses | members
  메뉴 구성·URL은 화면 흐름 설계서 "백오피스 왼쪽 메뉴"(177행), 1-3 화면 목록(A-01~A-08) 그대로다.
  설정(P2) 메뉴(진단·공지·콘테스트·템플릿·신고)는 이슈 #81 범위에서 제외한다.
  운영자만 들어오게 막는 것은 SecurityConfig(#12, /admin/** hasRole('ADMIN'))가 이미 하므로 여기서 검사하지 않는다.
-->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>

<aside th:fragment="sidebar(active)" class="vl-admin__sidebar">
    <a class="vl-admin__logo" href="/admin">바이브로그 백오피스</a>

    <nav class="vl-admin__nav">
        <a class="vl-admin__link" href="/admin"
           th:classappend="${active == 'dashboard'} ? 'is-active' : ''"
           th:attr="aria-current=${active == 'dashboard'} ? 'page' : null">대시보드</a>

        <p class="vl-admin__group">콘텐츠</p>
        <a class="vl-admin__link" href="/admin/tracks"
           th:classappend="${active == 'tracks'} ? 'is-active' : ''"
           th:attr="aria-current=${active == 'tracks'} ? 'page' : null">트랙</a>
        <a class="vl-admin__link" href="/admin/categories"
           th:classappend="${active == 'categories'} ? 'is-active' : ''"
           th:attr="aria-current=${active == 'categories'} ? 'page' : null">카테고리</a>
        <a class="vl-admin__link" href="/admin/courses"
           th:classappend="${active == 'courses'} ? 'is-active' : ''"
           th:attr="aria-current=${active == 'courses'} ? 'page' : null">코스</a>

        <p class="vl-admin__group">회원</p>
        <a class="vl-admin__link" href="/admin/members"
           th:classappend="${active == 'members'} ? 'is-active' : ''"
           th:attr="aria-current=${active == 'members'} ? 'page' : null">회원 목록</a>
    </nav>

    <a class="vl-admin__exit" href="/">← 학습자 화면으로</a>
</aside>

</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 수상작 목록 (순위순). 비공개·삭제된 수상작은 "비공개된 작품", 링크 없음 (contest 명세 결정 14) -->
<th:block th:fragment="awards(awards)">
    <div class="vl-ui-notice is-empty" th:if="${awards.empty}"><p>수상작이 없습니다</p></div>
    <ol class="ct-awards" th:unless="${awards.empty}">
        <li class="ct-award" th:each="a : ${awards}">
            <span class="ct-award__rank" th:text="${a.rank() + '등'}">1등</span>
            <a class="ct-link" th:if="${a.visible()}" th:href="@{/portfolios/{id}(id=${a.portfolioId()})}" th:text="${a.title()}">작품 제목</a>
            <span class="ct-muted" th:unless="${a.visible()}">비공개된 작품</span>
            <span class="ct-muted" th:text="${a.nickname() + ' · ' + a.votes() + '표'}">작성자 · 12표</span>
        </li>
    </ol>
</th:block>
</body>
</html>

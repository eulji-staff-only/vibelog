<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>지난 콘테스트 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/contest.css}">
</head>
<body class="ct-page">
<!-- U-33 지난 콘테스트 목록 (API-CTS-04, #202). 투표가 끝난 콘테스트를 최근 월부터 10개씩. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="ct-band">
    <h1 class="ct-title">지난 콘테스트</h1>
</section>

<main class="ct-main">
    <div class="vl-ui-panel ct-panel">
        <div class="vl-ui-notice is-empty" th:if="${contests.empty}"><p>지난 콘테스트가 없습니다</p></div>
        <ul class="ct-history" th:unless="${contests.empty}">
            <li th:each="c : ${contests}">
                <a th:href="@{/contests/{id}(id=${c.contestId()})}">
                    <strong th:text="${c.contestMonth() + ' · ' + c.topic()}">2026-11 · 주제</strong>
                    <span class="ct-muted" th:text="${c.firstPlace() != null} ? ${'1등 ' + c.firstPlace()} : '수상작 없음'">1등 작품 제목</span>
                </a>
            </li>
        </ul>
        <nav class="ct-pages" aria-label="페이지" th:if="${contests.totalPages > 1}">
            <a th:each="n : ${#numbers.sequence(1, contests.totalPages)}" th:href="@{/contests(page=${n})}" th:text="${n}"
               th:attr="aria-current=${n == contests.number + 1} ? 'page'">1</a>
        </nav>
        <a class="ct-link" th:href="@{/contests/current}">← 이달의 콘테스트</a>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${result.contestMonth() + ' 콘테스트 결과 | 바이브로그'}">콘테스트 결과 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/contest.css}">
</head>
<body class="ct-page">
<!-- U-33 지난 콘테스트 상세 (API-CTS-05, #202). 수상작 목록은 contest/awards 조각 (U-32 결과 보드와 같이 쓴다). -->
<div th:replace="~{common/layout :: header}"></div>

<section class="ct-band">
    <h1 class="ct-title" th:text="${result.contestMonth() + ' 콘테스트'}">2026-11 콘테스트</h1>
    <p class="ct-lead" th:text="${result.topic()}">주제</p>
</section>

<main class="ct-main">
    <div class="vl-ui-panel ct-panel">
        <section class="ct-section">
            <h2 class="ct-h2">주제 설명</h2>
            <p class="ct-description" th:text="${result.description()}">설명</p>
        </section>
        <section class="ct-section" aria-labelledby="awards-h">
            <h2 class="ct-h2" id="awards-h">수상작</h2>
            <div th:replace="~{contest/awards :: awards(${result.awards()})}"></div>
        </section>
        <a class="ct-link" th:href="@{/contests}">← 지난 콘테스트 목록</a>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

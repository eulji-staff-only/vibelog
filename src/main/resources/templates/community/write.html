<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing} ? '글 수정 | 바이브로그' : '글쓰기 | 바이브로그'">글쓰기 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <script th:src="@{/js/community.js}" defer></script>
</head>
<body class="cm-page">
<!-- U-23 글쓰기·수정 (API-CMT-03~06, #93). 틀리면 같은 폼에 입력값과 칸별 메시지를 다시 보여 준다 (사진은 다시 골라야 한다).
     글자 수 표시는 화면 안에서 돈다 (community.js). -->
<div th:replace="~{common/layout :: header}"></div>

<section class="cm-band">
    <h1 class="cm-title" th:text="${editing} ? '글 수정' : '글쓰기'">글쓰기</h1>
    <p class="cm-lead">자유롭게 이야기하고, 만든 작품을 공유해 보세요.</p>
</section>

<main class="cm-main">
    <div class="cm-panel">
        <!-- 이메일 인증 전 회원 (PL-USR-003) -->
        <div class="cm-notice" th:unless="${canWrite}">
            <p>이메일 인증 후 작성할 수 있습니다</p>
            <a class="cm-link" href="/auth/verify">인증 메일 받기</a>
        </div>

        <!-- th:action 으로 만들어야 CSRF 토큰이 자동으로 들어간다 -->
        <form class="cm-form" th:object="${postWriteRequest}" method="post" enctype="multipart/form-data" novalidate
              th:action="${editing} ? @{/community/{id}/edit(id=${postId})} : @{/community}"
              th:attr="data-draft=${editing} ? |post.${postId}| : 'post'">
            <!-- 금칙어·인증 등 칸 하나에 속하지 않는 오류 -->
            <div class="cm-notice is-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="message : ${#fields.globalErrors()}" th:text="${message}">오류</p>
            </div>

            <fieldset class="cm-field">
                <legend class="cm-label">카테고리</legend>
                <div class="cm-radios">
                    <label><input type="radio" th:field="*{category}" value="FREE"><span class="cm-chip">자유게시판</span></label>
                    <label><input type="radio" th:field="*{category}" value="QNA"><span class="cm-chip">질문·답변</span></label>
                    <label><input type="radio" th:field="*{category}" value="SHOWCASE"><span class="cm-chip">작품 공유</span></label>
                </div>
                <p class="cm-hint is-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">카테고리 오류</p>
            </fieldset>

            <div class="cm-field">
                <label class="cm-label" for="title">제목</label>
                <input class="cm-input" id="title" type="text" maxlength="100" data-count th:field="*{title}">
                <p class="cm-hint is-error" role="alert" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">제목 오류</p>
                <p class="cm-hint is-count"><span data-count-for="title">0</span> / 100</p>
            </div>

            <div class="cm-field">
                <label class="cm-label" for="body">본문</label>
                <textarea class="cm-input cm-textarea" id="body" maxlength="5000" data-count th:field="*{body}"></textarea>
                <p class="cm-hint is-error" role="alert" th:if="${#fields.hasErrors('body')}" th:errors="*{body}">본문 오류</p>
                <p class="cm-hint is-count"><span data-count-for="body">0</span> / 5,000</p>
            </div>

            <div class="cm-field">
                <label class="cm-label" for="images">사진</label>
                <!-- 수정: 사진 위 X를 누르면 그 사진을 지운다 (community.js가 keepPostImageIds 체크를 푼다) -->
                <ul class="cm-keep" th:unless="${existingImages.empty}">
                    <!-- 입력 오류로 다시 그릴 때는 지우기로 한 사진을 다시 보여 주지 않는다 (제출된 keepPostImageIds 에 있는 것만) -->
                    <li class="cm-keep-item" th:each="image : ${existingImages}"
                        th:if="${postWriteRequest.keepPostImageIds.contains(image.postImageId())}" data-keep-item>
                        <input type="checkbox" name="keepPostImageIds" th:value="${image.postImageId()}" hidden
                               th:checked="${postWriteRequest.keepPostImageIds.contains(image.postImageId())}">
                        <img th:src="${image.imageUrl()}" alt="기존 사진" class="cm-photo">
                        <button type="button" class="cm-keep-remove" aria-label="이 사진 지우기" data-keep-remove>×</button>
                    </li>
                </ul>
                <input id="images" type="file" name="images" accept=".jpg,.jpeg,.png,.webp" multiple>
                <p class="cm-hint is-error" role="alert" th:if="${#fields.hasErrors('images')}" th:errors="*{images}">사진 오류</p>
                <p class="cm-hint">최대 3장, 장당 5MB까지 올릴 수 있습니다 (JPG·PNG·WebP)</p>
                <p class="cm-hint" th:if="${#fields.hasAnyErrors()}">다시 보여 줄 때는 고른 사진이 지워지니 다시 골라 주세요</p>
            </div>

            <!-- 작품 공유를 고르면 나온다 (PL-CMT-008) -->
            <div class="cm-showcase">
                <div class="cm-field">
                    <label class="cm-label" for="workUrl">작품 링크</label>
                    <input class="cm-input" id="workUrl" type="url" maxlength="500" placeholder="https://" th:field="*{workUrl}">
                    <p class="cm-hint is-error" role="alert" th:if="${#fields.hasErrors('workUrl')}" th:errors="*{workUrl}">작품 링크 오류</p>
                    <p class="cm-hint is-error" role="alert" th:if="${#fields.hasErrors('workUrlValid')}" th:errors="*{workUrlValid}">작품 링크 형식 오류</p>
                </div>
                <div class="cm-field">
                    <label class="cm-label" for="tools">사용한 도구</label>
                    <input class="cm-input" id="tools" type="text" maxlength="200" placeholder="예: Claude, Cursor" th:field="*{tools}">
                    <p class="cm-hint is-error" role="alert" th:if="${#fields.hasErrors('toolsValid')}" th:errors="*{toolsValid}">도구 오류</p>
                </div>
            </div>

            <div class="cm-actions">
                <a class="cm-btn is-outline" th:href="${editing} ? @{/community/{id}(id=${postId})} : @{/community}">취소</a>
                <button class="cm-btn is-navy" type="submit" th:disabled="${!canWrite}" th:text="${editing} ? '저장' : '등록'">등록</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

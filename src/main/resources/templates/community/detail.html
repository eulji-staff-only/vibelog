<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${post.title()} + ' | 바이브로그'">게시글 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
    <!-- 즐겨찾기(API-CMT-13)는 JSON POST 라 CSRF 토큰을 헤더로 보낸다 (README "JSON API 약속") -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script th:src="@{/js/community.js}" defer></script>
</head>
<body class="cm-page">
<!-- U-22 게시글 상세 (API-CMT-02, #92). 수정(U-23)·삭제(M-05)는 #93. 댓글 하나의 모양·답글·수정·삭제는 community/comment.html (#94). -->
<div th:replace="~{common/layout :: header}"></div>

<section class="cm-band">
    <h1 class="cm-title">커뮤니티</h1>
</section>

<main class="cm-main">
    <div class="cm-panel">
        <a class="cm-link" href="/community">← 커뮤니티</a>

        <article class="cm-post">
            <div class="cm-row">
                <span class="cm-badge" th:classappend="${post.category().name() == 'SHOWCASE'} ? 'is-showcase'"
                      th:text="${post.category().label}">카테고리</span>
                <!-- 내 글일 때만 -->
                <div class="cm-comment__actions" th:if="${post.mine()}">
                    <a class="cm-btn is-outline is-s" th:href="@{/community/{id}/edit(id=${post.postId()})}">수정</a>
                    <button class="cm-btn is-outline is-s" type="button" data-open-dialog="delete-post">삭제</button>
                </div>
            </div>
            <h2 class="cm-post__title" th:text="${post.title()}">제목</h2>
            <p class="cm-muted">
                <a class="cm-link" th:if="${post.authorProfileId() != null}" th:href="@{/users/{id}(id=${post.authorProfileId()})}"
                   th:text="${post.nickname()}">작성자</a><span th:unless="${post.authorProfileId() != null}" th:text="${post.nickname()}">작성자</span>
                · <span th:text="${#temporals.format(post.createdAt(), 'yyyy.MM.dd HH:mm')}">작성일</span>
            </p>
            <!-- 즐겨찾기 (회원만, API-CMT-13). 페이지 이동 없이 글자만 바꾼다 -->
            <button class="cm-btn is-outline is-s" type="button" th:if="${loggedIn}" data-favorite
                    th:attr="data-url=@{/api/posts/{id}/favorite(id=${post.postId()})},aria-pressed=${post.favorited()}"
                    th:text="${post.favorited()} ? '즐겨찾기 취소' : '즐겨찾기'">즐겨찾기</button>
            <p class="cm-post__body" th:text="${post.body()}">본문</p>
            <div class="cm-photos" th:unless="${post.imageUrls().empty}">
                <img th:each="url, stat : ${post.imageUrls()}" th:src="${url}" th:alt="|게시글 사진 ${stat.count}|" class="cm-photo" loading="lazy">
            </div>
            <!-- 작품 공유 글만 (PL-CMT-008) -->
            <dl class="cm-work" th:if="${post.workUrl() != null}">
                <dt>작품 링크</dt>
                <dd>
                    <a class="cm-link" th:if="${post.workUrlLinkable()}" th:href="${post.workUrl()}" th:text="${post.workUrl()}"
                       target="_blank" rel="noopener noreferrer">작품 링크</a>
                    <span th:unless="${post.workUrlLinkable()}" th:text="${post.workUrl()}">작품 링크</span>
                </dd>
                <th:block th:if="${post.tools() != null and !post.tools().isBlank()}">
                    <dt>사용한 도구</dt>
                    <dd th:text="${post.tools()}">도구</dd>
                </th:block>
            </dl>
        </article>

        <section class="cm-comments" aria-labelledby="cm-comments-h">
            <h2 class="cm-h2" id="cm-comments-h" th:text="|댓글 ${post.commentCount()}|">댓글 0</h2>

            <!-- 댓글 입력 (500자, PL-CMT-006). 비회원은 로그인, 미인증 회원은 인증 안내 (U-22 예외, PL-USR-003) -->
            <div class="cm-notice" th:unless="${loggedIn}">
                <p>댓글은 로그인 후 남길 수 있습니다</p>
                <a class="cm-link" th:href="@{/login(redirect=|/community/${post.postId()}|)}">로그인</a>
            </div>
            <div class="cm-notice" th:if="${loggedIn and !canComment}">
                <p>이메일 인증 후 댓글을 남길 수 있습니다</p>
                <a class="cm-link" href="/auth/verify">인증 메일 받기</a>
            </div>
            <form class="cm-form" id="comment-form" method="post" th:if="${canComment}"
                  th:action="@{/community/{id}/comments(id=${post.postId()})}">
                <p class="cm-hint is-error" role="alert" th:if="${commentTarget == 'new'}" th:text="${commentError}">오류</p>
                <textarea class="cm-input cm-textarea is-short" name="content" maxlength="500" required
                          placeholder="댓글을 남겨 보세요" aria-label="댓글"
                          th:text="${commentTarget == 'new'} ? ${commentDraft} : ''"></textarea>
                <div class="cm-row">
                    <p class="cm-hint">500자까지 쓸 수 있습니다</p>
                    <button class="cm-btn is-navy is-s" type="submit">댓글 등록</button>
                </div>
            </form>

            <ul class="cm-comment-list" th:unless="${post.comments().empty}">
                <!-- th:replace 가 th:each 보다 먼저 돌아서, 반복은 바깥 th:block 에 둔다 -->
                <th:block th:each="comment : ${post.comments()}"><li th:replace="~{community/comment :: item(${comment}, false)}"></li></th:block>
            </ul>

            <p class="cm-muted" th:if="${post.comments().empty}">아직 댓글이 없습니다. 첫 댓글을 남겨 보세요.</p>
        </section>
    </div>
</main>

<!-- M-05 게시글 삭제 확인 (API-CMT-07). 삭제하면 목록(U-21)으로 간다 -->
<dialog class="cm-dialog" id="delete-post" aria-labelledby="delete-post-h" th:if="${post.mine()}">
    <div class="cm-form">
        <h2 class="cm-h2" id="delete-post-h">게시글을 삭제할까요?</h2>
        <p>삭제한 글은 되돌릴 수 없습니다.</p>
        <div class="cm-actions">
            <form method="dialog"><button class="cm-btn is-outline" value="cancel">취소</button></form>
            <form th:action="@{/community/{id}/delete(id=${post.postId()})}" method="post">
                <button class="cm-btn is-danger" type="submit">삭제</button>
            </form>
        </div>
    </div>
</dialog>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

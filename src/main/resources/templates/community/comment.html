<!--
  community/comment.html
  게시글 상세(U-22)의 댓글 하나. detail.html 이 댓글마다 item(c, false) 로, 그 안에서 답글마다 item(r, true) 로 쓴다 (#94).
  답글·수정 입력란은 <details> 로 접어 두고, 누르면 그 댓글 아래에 열린다 (U-22 "답글 → 그 댓글 아래 입력란 열림").
  입력 오류로 돌아오면 CommunityCommentController 가 넘긴 commentTarget(reply-{id}·edit-{id})의 입력란을 열고
  commentError(메시지)·commentDraft(쓰던 내용)를 다시 보여 준다.
-->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<li th:fragment="item(c, isReply)" class="cm-comment" th:id="|comment-${c.commentId()}|"
    th:classappend="${c.deleted()} ? 'is-deleted'"
    th:with="replyTarget=${'reply-' + c.commentId()}, editTarget=${'edit-' + c.commentId()}">
    <!-- 삭제된 댓글은 작성자·내용을 보여 주지 않는다 (PL-CMT-006) -->
    <p th:if="${c.deleted()}">삭제된 댓글입니다</p>
    <th:block th:unless="${c.deleted()}">
        <div class="cm-comment__head">
            <strong th:text="${c.nickname()}">작성자</strong>
            <span th:text="${#temporals.format(c.createdAt(), 'yyyy.MM.dd HH:mm')}">작성일</span>
            <span th:if="${c.edited()}">수정됨</span>
        </div>
        <p class="cm-comment__body" th:text="${c.content()}">댓글 내용</p>

        <div class="cm-comment__tools">
            <!-- 답글은 댓글에만 한 단계 (PL-CMT-006) -->
            <details class="cm-inline" th:if="${!isReply and canComment}" th:open="${commentTarget == replyTarget}">
                <summary class="cm-btn is-text is-s">답글</summary>
                <form class="cm-inline__form" method="post" th:action="@{/community/{id}/comments(id=${post.postId()})}">
                    <input type="hidden" name="parentCommentId" th:value="${c.commentId()}">
                    <p class="cm-hint is-error" role="alert" th:if="${commentTarget == replyTarget}" th:text="${commentError}">오류</p>
                    <textarea class="cm-input cm-textarea is-short" name="content" maxlength="500" required aria-label="답글"
                              th:text="${commentTarget == replyTarget} ? ${commentDraft} : ''"></textarea>
                    <button class="cm-btn is-navy is-s" type="submit">답글 등록</button>
                </form>
            </details>

            <!-- 내 댓글만 수정·삭제 (검사는 서버가 다시 한다) -->
            <th:block th:if="${c.mine()}">
                <details class="cm-inline" th:open="${commentTarget == editTarget}">
                    <summary class="cm-btn is-text is-s">수정</summary>
                    <form class="cm-inline__form" method="post" th:action="@{/comments/{id}/edit(id=${c.commentId()})}">
                        <p class="cm-hint is-error" role="alert" th:if="${commentTarget == editTarget}" th:text="${commentError}">오류</p>
                        <textarea class="cm-input cm-textarea is-short" name="content" maxlength="500" required aria-label="댓글 수정"
                                  th:text="${commentTarget == editTarget} ? ${commentDraft} : ${c.content()}"></textarea>
                        <button class="cm-btn is-navy is-s" type="submit">저장</button>
                    </form>
                </details>
                <form method="post" th:action="@{/comments/{id}/delete(id=${c.commentId()})}">
                    <button class="cm-btn is-text is-s" type="submit">삭제</button>
                </form>
            </th:block>
        </div>
    </th:block>

    <!-- 답글 목록. 삭제된 댓글 아래에도 답글은 남는다 -->
    <ul class="cm-replies" th:if="${!isReply and !c.replies().empty}">
        <!-- th:replace 가 th:each 보다 먼저 돌아서, 반복은 바깥 th:block 에 둔다 -->
        <th:block th:each="r : ${c.replies()}"><li th:replace="~{community/comment :: item(${r}, true)}"></li></th:block>
    </ul>
</li>

</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>동료 리뷰 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
</head>
<body class="cm-page">
<!--
  U-31 리뷰 요청 목록 (API-REV-02, #182·#183).
  위: 내가 쓴 리뷰(20개씩, myPage) — 작품이 비공개·삭제돼도 고치고 지울 수 있게 한다 (PL-REV-003).
  가운데: reviewRequestId 가 있으면 그 작품의 평가 기준별 코멘트 폼 (내 리뷰가 있으면 마감 뒤에도 수정 폼).
  아래: 리뷰를 기다리는 공개 포트폴리오 카드, 최근 요청순 20개씩 (page).
-->
<div th:replace="~{common/layout :: header}"></div>

<section class="cm-band">
    <h1 class="cm-title">동료 리뷰</h1>
    <p class="cm-lead">다른 학습자의 작품에 평가 기준별 코멘트를 남겨 보세요.</p>
</section>

<main class="cm-main">
    <div class="cm-panel">
        <div class="cm-notice is-toast" role="status" th:if="${toast}"><p th:text="${toast}">리뷰를 남겼습니다</p></div>

        <!-- 리뷰 쓰기·수정 -->
        <section class="cm-form" th:if="${form != null}" aria-labelledby="review-form-h">
            <h2 class="cm-h2" id="review-form-h" th:text="${form.editing()} ? '리뷰 수정' : '리뷰 쓰기'">리뷰 쓰기</h2>
            <p class="cm-muted">
                <a class="cm-link" th:if="${form.portfolioTitle() != T(com.vibelog.domain.community.model.dto.MyReviewItem).HIDDEN_TITLE}"
                   th:href="@{/portfolios/{id}(id=${form.portfolioId()})}" th:text="${form.portfolioTitle()}">작품 제목</a>
                <span th:unless="${form.portfolioTitle() != T(com.vibelog.domain.community.model.dto.MyReviewItem).HIDDEN_TITLE}"
                      th:text="${form.portfolioTitle()}">비공개된 작품</span>
            </p>
            <form class="cm-form" method="post" th:object="${reviewForm}" novalidate
                  th:action="${form.editing()} ? @{/peer-reviews/{id}/edit(id=${form.peerReviewId()})} : @{/review-requests/{id}/reviews(id=${form.reviewRequestId()})}">
                <div class="cm-notice is-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">리뷰를 저장하지 못했습니다</p>
                </div>
                <div class="cm-field" th:each="field, stat : ${form.fields()}">
                    <input type="hidden" th:if="${field.reviewCriterionId() != null}" th:field="*{comments[__${stat.index}__].reviewCriterionId}">
                    <label class="cm-label" th:for="|comment-${stat.index}|" th:text="${field.name() != null} ? ${field.name()} : '코멘트'">코멘트</label>
                    <p class="cm-hint" th:if="${field.description() != null}" th:text="${field.description()}">기준 설명</p>
                    <textarea class="cm-input cm-textarea is-short" th:id="|comment-${stat.index}|" maxlength="1000"
                              th:field="*{comments[__${stat.index}__].content}"
                              th:attr="aria-describedby=|comment-${stat.index}-error|"></textarea>
                    <p class="cm-hint is-error" th:id="|comment-${stat.index}-error|"
                       th:if="${#fields.hasErrors('comments[__${stat.index}__].content')}"
                       th:errors="*{comments[__${stat.index}__].content}">코멘트 오류</p>
                </div>
                <div class="cm-actions">
                    <a class="cm-btn is-outline" href="/reviews">취소</a>
                    <button class="cm-btn is-navy" type="submit" th:text="${form.editing()} ? '수정하기' : '리뷰 남기기'">리뷰 남기기</button>
                </div>
            </form>
        </section>

        <!-- 내가 쓴 리뷰 -->
        <section class="cm-form" aria-labelledby="my-reviews-h" th:unless="${myReviews.empty}">
            <h2 class="cm-h2" id="my-reviews-h">내가 쓴 리뷰</h2>
            <ul class="cm-list">
                <li th:each="r : ${myReviews.content}">
                    <div class="cm-review-card">
                        <div class="cm-review-card__head">
                            <span class="cm-item__title" th:text="${r.portfolioTitle()}">작품 제목</span>
                            <span class="cm-item__meta" th:text="${#temporals.format(r.createdAt(), 'yyyy.MM.dd')}">2026.11.09</span>
                        </div>
                        <div class="cm-review-card__actions">
                            <a class="cm-btn is-outline is-s" th:href="@{/reviews(reviewRequestId=${r.reviewRequestId()})}">수정</a>
                            <form method="post" th:action="@{/peer-reviews/{id}/delete(id=${r.peerReviewId()})}">
                                <button class="cm-btn is-outline is-s" type="submit">삭제</button>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
            <nav class="cm-pages" aria-label="내가 쓴 리뷰 페이지" th:if="${myReviews.totalPages > 1}"
                 th:with="current=${myReviews.number + 1},
                          start=${T(java.lang.Math).max(1, current - 4)},
                          end=${T(java.lang.Math).min(myReviews.totalPages, start + 9)}">
                <a th:each="p : ${#numbers.sequence(start, end)}" th:href="@{/reviews(myPage=${p}, page=${requests.number + 1})}"
                   th:attr="aria-current=${p == current} ? 'page'" th:text="${p}">1</a>
            </nav>
        </section>

        <!-- 리뷰를 기다리는 작품 -->
        <section class="cm-form" aria-labelledby="requests-h">
            <h2 class="cm-h2" id="requests-h">리뷰를 기다리는 작품</h2>
            <ul class="cm-list" th:unless="${requests.empty}">
                <li th:each="c : ${requests.content}">
                    <div class="cm-review-card">
                        <div class="cm-review-card__head">
                            <a class="cm-item__title cm-link" th:href="@{/portfolios/{id}(id=${c.portfolioId()})}" th:text="${c.title()}">작품 제목</a>
                            <span class="cm-item__count" th:text="|리뷰 ${c.reviewCount()}|">리뷰 0</span>
                        </div>
                        <p class="cm-muted" th:text="${c.summary()}">한 줄 요약</p>
                        <p class="cm-item__meta"
                           th:text="|${c.courseTitle() != null ? c.courseTitle() + ' · ' : ''}${c.nickname()} · ${#temporals.format(c.requestedAt(), 'yyyy.MM.dd')} 요청|">코스 · 작성자 · 요청일</p>
                        <a class="cm-btn is-navy is-s" th:href="@{/reviews(reviewRequestId=${c.reviewRequestId()})}">리뷰 쓰기</a>
                    </div>
                </li>
            </ul>
            <p class="cm-muted" th:if="${requests.empty}">지금 리뷰를 기다리는 작품이 없습니다</p>
            <nav class="cm-pages" aria-label="리뷰 요청 페이지" th:if="${requests.totalPages > 1}"
                 th:with="current=${requests.number + 1},
                          start=${T(java.lang.Math).max(1, current - 4)},
                          end=${T(java.lang.Math).min(requests.totalPages, start + 9)}">
                <a th:each="p : ${#numbers.sequence(start, end)}" th:href="@{/reviews(page=${p}, myPage=${myPage})}"
                   th:attr="aria-current=${p == current} ? 'page'" th:text="${p}">1</a>
            </nav>
        </section>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

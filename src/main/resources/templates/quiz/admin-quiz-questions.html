<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  A-06 수업 편집 활동 탭의 퀴즈 문항 조각 (API-ADM-26~28, FR-LSN-012, #102). lesson/admin-lesson.html 이 끼워 쓴다.
  - 퀴즈 활동마다 문항 목록과 "문항 추가"를 보여준다. 문항 목록은 A-06 데이터(lesson.quizQuestionsOf(활동 ID),
    QuizReader.getAdminQuestionsOf)를 그대로 쓰고, 개념 태그 고르기는 lesson.conceptTags() 로 채운다.
  - 입력이 틀리면 QuizAdminController 가 flash 로 넘긴 quizQuestionForm·quizQuestionErrors·quizQuestionTarget 으로
    그 모달을 열린 채로 다시 그린다 (같은 폼 다시 + 칸별 메시지, _template.md ④). 모의고사 문항 조각과 같은 방식.
  - 보기 4개·정답 1개, 코드 빈칸 채우기·결과 유추하기는 코드 필수 (FR-LSN-012). 퀴즈 하나는 3~5문항 (PL-LSN-003).
-->

<!-- 활동 탭 안의 퀴즈 문항 본문 -->
<section class="qa-panel" th:fragment="panel">
    <h3 class="al-h2">퀴즈 문항</h3>
    <p class="al-hint">퀴즈 하나에 사용 중인 문항이 3~5개여야 수업을 공개할 수 있습니다 (PL-LSN-003). 이미 풀이 기록이 있는 문항을 고치면 지난 기록을 지키려고 예전 문항은 중지되고 새 문항으로 저장됩니다.</p>

    <p class="al-empty" th:unless="${#lists.contains(lesson.activities().![activityType().name()], 'QUIZ')}">퀴즈 활동을 추가하면 문항을 등록할 수 있습니다</p>

    <th:block th:each="activity : ${lesson.activities()}" th:if="${activity.activityType().name() == 'QUIZ'}">
        <div class="qa-quiz" th:with="questions=${lesson.quizQuestionsOf(activity.activityId())}">
            <div class="al-panel-head">
                <h4 class="qa-quiz__title">
                    <span th:text="${activity.title()}">퀴즈 활동</span>
                    <span class="qa-count" th:text="|사용 중 ${#lists.size(questions.?[active()])}개|">사용 중 0개</span>
                </h4>
                <button type="button" class="vl-ui-btn is-outline is-s"
                        th:attr="data-ui-modal-open='quiz-question-add-modal-' + ${activity.activityId()}">문항 추가</button>
            </div>
            <p class="al-empty" th:if="${questions.empty}">아직 등록된 문항이 없습니다</p>
            <ol class="al-exam-list" th:unless="${questions.empty}">
                <li class="al-exam-row" th:each="question : ${questions}">
                    <span class="al-activity-no" th:text="${question.sortOrder()}">1</span>
                    <span class="qa-type" th:text="${question.displayType().label}">개념 문제</span>
                    <span class="al-exam-content" th:text="${question.content()}">문항 내용</span>
                    <span th:replace="~{common/ui :: badge(${question.active()} ? 'success' : 'neutral', ${question.active()} ? '사용' : '중지')}"></span>
                    <div class="al-activity-actions">
                        <button type="button" class="vl-ui-btn is-outline is-s"
                                th:attr="data-ui-modal-open='quiz-question-edit-modal-' + ${question.quizQuestionId()}">수정</button>
                        <form method="post" th:action="@{/admin/quiz-questions/{id}/active(id=${question.quizQuestionId()})}">
                            <input type="hidden" name="active" th:value="${!question.active()}">
                            <button type="submit" class="vl-ui-btn is-outline is-s" th:text="${question.active()} ? '사용 중지' : '다시 사용'">사용 중지</button>
                        </form>
                    </div>
                </li>
            </ol>
        </div>
    </th:block>
</section>

<!-- 문항 추가·수정 모달 (A-06 맨 아래에 끼운다) -->
<th:block th:fragment="modals">
    <th:block th:each="activity : ${lesson.activities()}" th:if="${activity.activityType().name() == 'QUIZ'}">
        <div th:replace="~{quiz/admin-quiz-questions :: questionModal(${'quiz-question-add-modal-' + activity.activityId()},
                ${activity.title() + ' 문항 추가'}, @{/admin/activities/{id}/questions(id=${activity.activityId()})}, null,
                ${quizQuestionTarget == 'new-' + activity.activityId()})}"></div>
    </th:block>
    <th:block th:each="question : ${lesson.quizQuestions()}">
        <div th:replace="~{quiz/admin-quiz-questions :: questionModal(${'quiz-question-edit-modal-' + question.quizQuestionId()}, '문항 수정',
                @{/admin/quiz-questions/{id}/edit(id=${question.quizQuestionId()})}, ${question},
                ${quizQuestionTarget == #strings.toString(question.quizQuestionId())})}"></div>
    </th:block>
</th:block>

<!--
  question: 수정할 문항(AdminQuizQuestionItem), 추가면 null. open: 입력 오류로 돌아온 그 모달이면 true.
  open 이면 보낸 값(f)·칸별 메시지(errs)로, 아니면 저장된 문항 값으로 채운다.
-->
<div class="vl-ui-modal" th:fragment="questionModal(modalId, heading, action, question, open)"
     th:id="${modalId}" th:hidden="${!open}" role="dialog" aria-modal="true"
     th:attr="data-ui-modal=${modalId}, aria-labelledby=${modalId + '-title'}"
     th:with="f=${open ? quizQuestionForm : null}, errs=${open ? quizQuestionErrors : null}">
    <div class="vl-ui-modal__box">
        <h2 class="vl-ui-modal__title" tabindex="-1" th:autofocus="${open}" th:id="${modalId + '-title'}" th:text="${heading}">문항 추가</h2>
        <form class="al-form" method="post" novalidate th:action="${action}">
            <div class="al-field">
                <label th:for="${modalId + '-type'}">표시 유형</label>
                <select th:id="${modalId + '-type'}" name="displayType"
                        th:with="selected=${f != null ? (f.displayType != null ? f.displayType.name() : '') : (question != null ? question.displayType().name() : '')}">
                    <option value="">표시 유형을 고르세요</option>
                    <option value="CODE_BLANK" th:selected="${selected == 'CODE_BLANK'}">코드 빈칸 채우기</option>
                    <option value="CONCEPT" th:selected="${selected == 'CONCEPT'}">개념 문제</option>
                    <option value="OUTPUT_PREDICT" th:selected="${selected == 'OUTPUT_PREDICT'}">결과 유추하기</option>
                    <option value="TRICK" th:selected="${selected == 'TRICK'}">낚시 문제</option>
                </select>
                <p class="al-error" role="alert" th:if="${errs != null and errs['displayType'] != null}"
                   th:text="${errs['displayType']}">표시 유형 오류</p>
            </div>
            <div class="al-field">
                <label th:for="${modalId + '-content'}">문항</label>
                <textarea th:id="${modalId + '-content'}" name="content"
                          th:text="${f != null ? f.content : question?.content()}"></textarea>
                <p class="al-error" role="alert" th:if="${errs != null and errs['content'] != null}"
                   th:text="${errs['content']}">문항 오류</p>
            </div>
            <div class="al-field">
                <label th:for="${modalId + '-code'}">코드 <span class="qa-hint">(코드 빈칸 채우기·결과 유추하기는 필수)</span></label>
                <textarea class="qa-code" th:id="${modalId + '-code'}" name="codeSnippet" spellcheck="false"
                          th:text="${f != null ? f.codeSnippet : question?.codeSnippet()}"></textarea>
                <p class="al-error" role="alert" th:if="${errs != null and errs['codeSnippet'] != null}"
                   th:text="${errs['codeSnippet']}">코드 오류</p>
            </div>
            <div class="al-field">
                <label th:for="${modalId + '-tag'}">개념 태그</label>
                <select th:id="${modalId + '-tag'}" name="conceptTagId"
                        th:with="selected=${f != null ? f.conceptTagId : question?.conceptTagId()}">
                    <option value="">개념 태그를 고르세요</option>
                    <option th:each="tag : ${lesson.conceptTags()}" th:value="${tag.conceptTagId()}"
                            th:selected="${tag.conceptTagId() == selected}" th:text="${tag.name()}">태그</option>
                </select>
                <p class="al-error" role="alert" th:if="${errs != null and errs['conceptTagId'] != null}"
                   th:text="${errs['conceptTagId']}">개념 태그 오류</p>
            </div>
            <fieldset class="al-field">
                <legend>보기 (정답 하나를 고르세요)</legend>
                <div class="qa-choice" th:each="i : ${#numbers.sequence(0, 3)}">
                    <input type="radio" name="correctIndex" th:value="${i}" th:attr="aria-label=|${i + 1}번 보기를 정답으로|"
                           th:checked="${f != null ? f.correctIndex == i
                                        : (question != null and i < question.choices().size() and question.choices()[i].correct())}">
                    <input type="text" name="choices" maxlength="500" th:attr="aria-label=|${i + 1}번 보기|"
                           th:value="${f != null ? f.choiceAt(i)
                                      : (question != null and i < question.choices().size() ? question.choices()[i].content() : '')}">
                </div>
                <p class="al-error" role="alert" th:if="${errs != null and errs['choices'] != null}"
                   th:text="${errs['choices']}">보기 오류</p>
                <p class="al-error" role="alert" th:if="${errs != null and errs['correctIndex'] != null}"
                   th:text="${errs['correctIndex']}">정답 오류</p>
            </fieldset>
            <div class="al-field">
                <label th:for="${modalId + '-explanation'}">해설</label>
                <textarea th:id="${modalId + '-explanation'}" name="explanation"
                          th:text="${f != null ? f.explanation : question?.explanation()}"></textarea>
                <p class="al-error" role="alert" th:if="${errs != null and errs['explanation'] != null}"
                   th:text="${errs['explanation']}">해설 오류</p>
            </div>
            <div class="vl-ui-modal__actions">
                <button type="button" class="vl-ui-btn is-outline" data-ui-modal-close>취소</button>
                <button type="submit" class="vl-ui-btn is-navy">저장</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

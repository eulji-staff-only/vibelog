<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 포트폴리오 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/my-portfolio.css}" href="/css/my-portfolio.css">
    <!-- 공개 전환(API-PRT-08)은 JSON POST 라 CSRF 토큰을 헤더로 보낸다 (README "JSON API 약속") -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script th:src="@{/js/ui.js}" src="/js/ui.js" defer></script>
    <script th:src="@{/js/my-portfolio.js}" src="/js/my-portfolio.js" defer></script>
</head>
<body>
<!-- U-19 내 포트폴리오 (API-PRT-05, #114). 공개 전환(API-PRT-08)은 새로고침 없이 my-portfolio.js 가, 삭제(API-PRT-07)는 M-04 확인 후 폼 POST.
     버튼·배지·모달은 아직 화면 전용 클래스를 쓴다. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="mp-band">
    <h1 class="mp-title">내 포트폴리오</h1>
    <p class="mp-lead">제출한 결과물을 확인하고, 공개 여부를 바꾸거나 수정·삭제합니다.</p>
</section>

<main class="mp-main">
    <div class="mp-panel">
        <p class="vl-flash" role="status" th:if="${toast}" th:text="${toast}">알림</p>
        <!-- 수정이 끝났으니 U-17 에 보관해 둔 작성 내용을 지운다 (FR-PRT-010) -->
        <span hidden th:if="${clearDraft}" th:attr="data-draft-clear=${clearDraft}"></span>
        <div class="mp-head">
            <h2 class="mp-h2">제출한 포트폴리오</h2>
            <span class="mp-muted" th:text="|${#lists.size(portfolios)}개|">2개</span>
        </div>

        <div class="mp-cards" data-mp-list th:unless="${#lists.isEmpty(portfolios)}">
            <article class="mp-card" th:each="card : ${portfolios}">
                <div class="mp-card-body">
                    <div class="mp-card-meta">
                        <span class="mp-badge" data-vis-badge th:classappend="${card.isPublic()} ? 'mp-badge-strong' : 'mp-badge-neutral'"
                              th:text="${card.isPublic()} ? '공개' : '비공개'">공개</span>
                        <span class="mp-badge mp-badge-neutral" th:if="${reviewOpenIds.contains(card.portfolioId())}">리뷰 요청 중</span>
                        <span class="mp-muted" th:text="${card.courseTitle()}">[코스 이름]</span>
                    </div>
                    <a class="mp-card-title" th:href="@{/portfolios/{id}(id=${card.portfolioId()})}" th:text="${card.title()}">[포트폴리오 제목]</a>
                    <p class="mp-card-summary" th:text="${card.summary()}">[한 줄 요약]</p>
                    <span class="mp-caption" th:text="|제출일 ${#temporals.format(card.submittedAt(), 'yyyy.MM.dd')}|">제출일 [제출일]</span>
                </div>
                <div class="mp-card-actions">
                    <button type="button" class="mp-btn mp-btn-outline" data-vis-toggle
                            th:attr="data-visibility-url=@{/api/portfolios/{id}/visibility(id=${card.portfolioId()})},data-public=${card.isPublic()}"
                            th:text="${card.isPublic()} ? '비공개로 전환' : '공개로 전환'">비공개로 전환</button>
                    <a class="mp-btn mp-btn-outline" th:if="${card.courseId() != null}"
                       th:href="@{/courses/{id}/portfolio(id=${card.courseId()},edit=true)}">수정</a>
                    <button type="button" class="mp-btn mp-btn-text" data-open-delete
                            th:attr="data-delete-url=@{/portfolios/{id}/delete(id=${card.portfolioId()})}">삭제</button>
                </div>
            </article>
        </div>

        <!-- 빈 상태 (U-19 예외) -->
        <div class="mp-empty" th:if="${#lists.isEmpty(portfolios)}">
            <strong>제출한 포트폴리오가 없습니다.</strong>
            <p>코스의 마지막 수업을 마치면 포트폴리오를 제출할 수 있습니다.</p>
            <a class="mp-btn mp-btn-outline" th:href="@{/my/learning}">내 학습으로</a>
        </div>
    </div>
</main>

<!-- M-04 포트폴리오 삭제 확인. 누른 카드의 삭제 주소를 my-portfolio.js 가 폼 action 에 넣는다 -->
<div class="mp-modal" data-delete-modal hidden>
    <div class="mp-modal-box" role="dialog" aria-modal="true" aria-labelledby="mp-delete-title">
        <h2 class="mp-modal-title" id="mp-delete-title" tabindex="-1">포트폴리오를 삭제할까요?</h2>
        <p class="mp-modal-text">삭제하면 포트폴리오 카드와 공개 페이지가 사라지며 되돌릴 수 없습니다.</p>
        <p class="mp-modal-warn">이 코스의 완료 조건이 다시 미충족 상태가 됩니다.</p>
        <form class="mp-modal-actions" method="post" th:action="@{/portfolios/0/delete}" data-delete-form>
            <button type="button" class="mp-btn mp-btn-outline" data-close-delete>취소</button>
            <button type="submit" class="mp-btn mp-btn-danger">삭제</button>
        </form>
    </div>
</div>

<div th:replace="~{common/ui :: toastContainer}"></div>
<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

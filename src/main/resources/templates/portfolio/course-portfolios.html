<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>같은 코스 작품 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/my-portfolio.css}" href="/css/my-portfolio.css">
</head>
<body>
<!-- U-35 같은 코스 작품 보기 (API-PRT-10, FR-PRT-009, #197). 그 코스에 포트폴리오를 낸 사람만 들어온다 (PL-PRT-011).
     공개 작품만 최근 제출순 20개씩. 카드는 U-20 상세로 간다. 화면 설계 프로토타입이 없어 U-19 카드 모양을 쓴다. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="mp-band">
    <span class="mp-eyebrow" th:text="${view.courseTitle()}">[코스 이름]</span>
    <h1 class="mp-title">같은 코스 작품</h1>
    <p class="mp-lead">같은 코스를 마친 학습자들이 공개한 포트폴리오입니다.</p>
</section>

<main class="mp-main">
    <div class="mp-panel">
        <div class="mp-head">
            <h2 class="mp-h2">공개된 작품</h2>
            <span class="mp-muted" th:text="|${view.portfolios().totalElements}개|">0개</span>
        </div>

        <div class="mp-cards" th:unless="${view.portfolios().empty}">
            <article class="mp-card" th:each="card : ${view.portfolios().content}">
                <div class="mp-card-body">
                    <a class="mp-card-title" th:href="@{/portfolios/{id}(id=${card.portfolioId()})}" th:text="${card.title()}">[포트폴리오 제목]</a>
                    <p class="mp-card-summary" th:text="${card.summary()}">[한 줄 요약]</p>
                    <span class="mp-caption" th:text="|${card.authorNickname()} · 제출일 ${#temporals.format(card.submittedAt(), 'yyyy.MM.dd')}|">[작성자] · 제출일 [제출일]</span>
                </div>
            </article>
        </div>

        <div class="mp-empty" th:if="${view.portfolios().empty}">
            <strong>아직 공개된 작품이 없습니다.</strong>
            <a class="mp-btn mp-btn-outline" th:href="@{/my/portfolios}">내 포트폴리오로</a>
        </div>

        <nav class="mp-pages" aria-label="페이지" th:if="${view.portfolios().totalPages > 1}">
            <a th:each="n : ${#numbers.sequence(1, view.portfolios().totalPages)}"
               th:href="@{/courses/{id}/portfolios(id=${view.courseId()}, page=${n})}"
               th:attr="aria-current=${n == view.portfolios().number + 1} ? 'page'" th:text="${n}">1</a>
        </nav>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="au-page">
<!-- U-06 비밀번호 재설정. 메일 링크로만 들어온다. 화면 선행 작업(#49): token 확인·변경과 상태(입력 / 변경됨 / 만료)는
     ③ 단계 비밀번호 찾기 기능(#90)에서 붙인다. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="au-band">
    <h1 class="au-title">비밀번호 재설정</h1>
    <p class="au-lead">새로 쓸 비밀번호를 입력하세요.</p>
</section>

<main class="au-main">
    <div class="au-panel">
        <!-- 입력 -->
        <form class="au-form">
            <div class="au-field">
                <label class="au-label" for="password">새 비밀번호</label>
                <input class="au-input" id="password" type="password" autocomplete="new-password">
                <p class="au-hint">8자 이상, 영문과 숫자를 모두 넣어 주세요</p>
            </div>
            <div class="au-field">
                <label class="au-label" for="passwordConfirm">새 비밀번호 확인</label>
                <input class="au-input" id="passwordConfirm" type="password" autocomplete="new-password">
                <!-- 서로 다르면 ③ 단계에서 보여 준다 -->
                <p class="au-hint is-error" hidden>새 비밀번호가 서로 다릅니다</p>
            </div>
            <!-- ③ 단계에서 type="submit" 으로 바꾼다 -->
            <button class="au-btn is-navy" type="button">비밀번호 변경</button>
        </form>

        <!-- 변경됨 -->
        <section class="au-form" hidden>
            <div class="au-notice is-success">
                <strong>비밀번호가 변경되었습니다</strong>
                <p>새 비밀번호로 로그인하세요.</p>
            </div>
            <a class="au-btn is-navy" href="/login">로그인하러 가기</a>
        </section>

        <!-- 만료·사용됨 (30분, 1회, PL-USR-004) -->
        <section class="au-form" hidden>
            <div class="au-notice is-danger">
                <strong>링크가 만료되었습니다</strong>
                <p>재설정 링크는 30분 동안 한 번만 쓸 수 있습니다. 메일을 다시 받아 주세요.</p>
            </div>
            <a class="au-btn is-navy" href="/password/find">재설정 메일 다시 받기</a>
        </section>

        <p class="au-links"><a class="au-link" href="/login">로그인</a></p>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

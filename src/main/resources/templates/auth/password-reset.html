<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="au-page">
<!-- U-06 비밀번호 재설정 (API-USR-13·14, #90). 메일 링크로만 들어온다. 쓸 수 없는 링크면 expired 상태로 U-05 바로가기를 보여 주고,
     바꾸면 로그인 화면으로 가서 "비밀번호가 변경되었습니다"를 보여 준다. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="au-band">
    <h1 class="au-title">비밀번호 재설정</h1>
    <p class="au-lead">새로 쓸 비밀번호를 입력하세요.</p>
</section>

<main class="au-main">
    <div class="au-panel">
        <!-- 입력 -->
        <form class="au-form" th:unless="${expired}" th:action="@{/password/reset}" th:object="${passwordResetRequest}" method="post" novalidate>
            <input type="hidden" th:field="*{token}">
            <div class="au-field">
                <label class="au-label" for="newPassword">새 비밀번호</label>
                <input class="au-input" id="newPassword" type="password" autocomplete="new-password" required
                       th:field="*{newPassword}" th:attrappend="aria-invalid=${#fields.hasErrors('newPassword')} ? 'true'">
                <p class="au-hint" th:unless="${#fields.hasErrors('newPassword')}">8~64자, 영문과 숫자를 모두 넣어 주세요 (한글·공백 제외)</p>
                <p class="au-hint is-error" role="alert" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">비밀번호 오류</p>
            </div>
            <div class="au-field">
                <label class="au-label" for="newPasswordConfirm">새 비밀번호 확인</label>
                <input class="au-input" id="newPasswordConfirm" type="password" autocomplete="new-password" required
                       th:field="*{newPasswordConfirm}" th:attrappend="aria-invalid=${#fields.hasErrors('newPasswordConfirmed')} ? 'true'">
                <p class="au-hint is-error" role="alert" th:if="${#fields.hasErrors('newPasswordConfirmed')}" th:errors="*{newPasswordConfirmed}">새 비밀번호가 서로 다릅니다</p>
            </div>
            <button class="au-btn is-navy" type="submit">비밀번호 변경</button>
        </form>

        <!-- 만료·사용됨 (30분, 1회, PL-USR-004) -->
        <section class="au-form" th:if="${expired}">
            <div class="au-notice is-danger">
                <strong>링크가 만료되었습니다</strong>
                <p>재설정 링크는 30분 동안 한 번만 쓸 수 있습니다. 메일을 다시 받아 주세요.</p>
            </div>
            <a class="au-btn is-navy" href="/password/find">재설정 메일 다시 받기</a>
        </section>

        <p class="au-links"><a class="au-link" href="/login">로그인</a></p>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

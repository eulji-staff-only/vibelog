<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이메일 인증 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="au-page">
<!-- U-04 이메일 인증 결과. 화면 선행 작업(#49): 상태(성공 / 만료·사용됨 / 다시 보냄)는 ③ 단계 이메일 인증 기능(#89)에서
     token 확인 결과로 하나만 보여 준다. token 없이 열면 "다시 받기" 상태다. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="au-band">
    <h1 class="au-title">이메일 인증</h1>
</section>

<main class="au-main">
    <div class="au-panel">
        <!-- 성공 -->
        <section class="au-form">
            <div class="au-notice is-success">
                <strong>이메일 인증이 완료되었습니다</strong>
                <p>이제 글과 포트폴리오를 작성할 수 있습니다.</p>
            </div>
            <a class="au-btn is-navy" href="/login">로그인하러 가기</a>
        </section>

        <!-- 만료·사용됨 (24시간, PL-USR-004) / token 없이 열었을 때 -->
        <section class="au-form" hidden>
            <div class="au-notice is-danger">
                <strong>인증 링크가 만료되었습니다</strong>
                <p>인증 메일을 다시 받아 24시간 안에 링크를 눌러 주세요.</p>
            </div>
            <div class="au-field">
                <label class="au-label" for="email">이메일</label>
                <input class="au-input" id="email" type="email" autocomplete="email">
            </div>
            <button class="au-btn is-navy" type="button">인증 메일 다시 받기</button>
        </section>

        <!-- 다시 보냄. 1분 뒤에 다시 받을 수 있다 (PL-CST-002). 버튼을 켜는 시점은 ③ 단계에서 정한다 -->
        <section class="au-form" hidden>
            <div class="au-notice">
                <strong>인증 메일을 다시 보냈습니다</strong>
                <p>이전에 받은 링크는 더 이상 쓸 수 없습니다.</p>
            </div>
            <button class="au-btn is-outline" type="button" aria-disabled="true">인증 메일 다시 받기</button>
            <p class="au-hint">1분 뒤에 다시 받을 수 있습니다</p>
        </section>

        <p class="au-links">이미 인증했나요? <a class="au-link" href="/login">로그인</a></p>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

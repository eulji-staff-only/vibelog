<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="au-page">
<!-- U-03 로그인. 폼은 #12 에서 Spring Security 에 연결했다. 구글·깃허브 로그인 동작은 소셜 로그인 이슈(#91)에서 붙인다. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="au-band">
    <h1 class="au-title">로그인</h1>
    <p class="au-lead">이어서 학습하려면 로그인하세요.</p>
</section>

<main class="au-main">
    <div class="au-panel">
        <div class="au-notice" th:if="${param.redirect}">
            <p>로그인 시간이 지나 로그아웃되었습니다. 다시 로그인하면 보던 화면으로 돌아갑니다</p>
        </div>
        <div class="au-notice is-danger" th:if="${param.locked}">
            <strong>잠시 로그인할 수 없습니다</strong>
            <p>로그인에 5번 실패해 5분 동안 로그인할 수 없습니다. 5분 뒤에 다시 시도해 주세요.</p>
        </div>

        <!-- th:action 으로 만들어야 CSRF 토큰이 자동으로 들어간다 -->
        <form class="au-form" th:action="@{/login}" method="post">
            <input type="hidden" name="redirect" th:if="${param.redirect}" th:value="${param.redirect[0]}">
            <div class="au-field">
                <label class="au-label" for="email">이메일</label>
                <input class="au-input" id="email" type="email" name="email" autocomplete="username" required>
            </div>
            <div class="au-field">
                <label class="au-label" for="password">비밀번호</label>
                <input class="au-input" id="password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <div class="au-row">
                <label class="au-check"><input type="checkbox" name="rememberMe"> 로그인 유지(14일)</label>
                <a class="au-link" href="/password/find">비밀번호 찾기</a>
            </div>
            <p class="au-hint is-error" role="alert" th:if="${param.error}">이메일 또는 비밀번호가 맞지 않습니다</p>
            <button class="au-btn is-navy" type="submit">로그인</button>
        </form>

        <p class="au-divider">또는</p>
        <div class="au-social">
            <button class="au-btn is-outline" type="button">구글로 계속하기</button>
            <button class="au-btn is-outline" type="button">깃허브로 계속하기</button>
        </div>

        <p class="au-links">아직 회원이 아닌가요? <a class="au-link" href="/signup">회원가입</a></p>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

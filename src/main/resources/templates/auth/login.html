<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
</head>
<body>
<!-- U-03 로그인. #12 에서는 동작하는 최소 폼만 둔다. 디자인은 #49, 로그인 유지·소셜 로그인은 #12 다음 작업에서 붙인다 -->
<main>
    <h1>로그인</h1>

    <p th:if="${param.redirect}">로그인 시간이 지나 로그아웃되었습니다. 다시 로그인하면 보던 화면으로 돌아갑니다</p>

    <!-- th:action 으로 만들어야 CSRF 토큰이 자동으로 들어간다 -->
    <form th:action="@{/login}" method="post">
        <input type="hidden" name="redirect" th:if="${param.redirect}" th:value="${param.redirect[0]}">
        <label>이메일 <input type="email" name="email" autocomplete="username" required></label>
        <label>비밀번호 <input type="password" name="password" autocomplete="current-password" required></label>
        <p th:if="${param.error}">이메일 또는 비밀번호가 맞지 않습니다</p>
        <button type="submit">로그인</button>
    </form>
</main>
</body>
</html>

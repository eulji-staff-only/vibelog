<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="au-page">
<!-- U-02 회원가입. 화면 선행 작업(#49): 폼 전송(th:action·name)과 입력 오류 표시는 ③ 단계 회원가입 기능(#88)에서 붙인다. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="au-band">
    <h1 class="au-title">회원가입</h1>
    <p class="au-lead">닉네임·이메일·비밀번호만 입력하면 바로 학습을 시작할 수 있습니다.</p>
</section>

<main class="au-main">
    <div class="au-panel">
        <form class="au-form">
            <div class="au-field">
                <label class="au-label" for="nickname">닉네임</label>
                <input class="au-input" id="nickname" type="text" maxlength="12" autocomplete="nickname">
                <p class="au-hint">2~12자, 한글·영문·숫자만 쓸 수 있습니다 (공백·특수문자 불가)</p>
            </div>
            <div class="au-field">
                <label class="au-label" for="email">이메일</label>
                <input class="au-input" id="email" type="email" autocomplete="email">
                <!-- 이메일 중복이면 ③ 단계에서 보여 준다 -->
                <p class="au-hint is-error" hidden>이미 가입된 이메일입니다. 로그인해 주세요. <a class="au-link" href="/login">로그인</a></p>
            </div>
            <div class="au-field">
                <label class="au-label" for="password">비밀번호</label>
                <input class="au-input" id="password" type="password" autocomplete="new-password">
                <p class="au-hint">8자 이상, 영문과 숫자를 모두 넣어 주세요</p>
            </div>
            <!-- ③ 단계에서 type="submit" 으로 바꾼다 -->
            <button class="au-btn is-navy" type="button">회원가입</button>
        </form>

        <!-- 가입하면 같은 화면에서 보여 준다 (③ 단계) -->
        <div class="au-notice is-success" hidden>
            <strong>가입이 완료되었습니다</strong>
            <p>인증 메일을 보냈습니다. 메일의 링크는 24시간 동안 쓸 수 있고, 인증 전에도 로그인·학습할 수 있습니다.</p>
            <a class="au-link" href="/diagnosis">첫 진단 시작하기</a>
        </div>

        <p class="au-links">구글·깃허브 계정으로 가입하려면 로그인 화면에서 시작하세요.</p>
        <p class="au-links">이미 회원인가요? <a class="au-link" href="/login">로그인</a></p>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

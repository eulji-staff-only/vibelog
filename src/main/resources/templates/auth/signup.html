<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="au-page">
<!-- U-02 회원가입 (API-USR-02·03, #88). 틀리면 같은 폼에 입력값과 칸별 메시지를 다시 보여 준다 (비밀번호는 다시 채우지 않는다). -->
<div th:replace="~{common/layout :: header}"></div>

<section class="au-band">
    <h1 class="au-title">회원가입</h1>
    <p class="au-lead">닉네임·이메일·비밀번호만 입력하면 바로 학습을 시작할 수 있습니다.</p>
</section>

<main class="au-main">
    <div class="au-panel">
        <!-- 가입 완료 (done=true) -->
        <div class="au-notice is-success" th:if="${param.done}">
            <strong>가입이 완료되었습니다</strong>
            <p>인증 메일을 보냈습니다. 메일의 링크는 24시간 동안 쓸 수 있고, 인증 전에도 로그인·학습할 수 있습니다.</p>
            <a class="au-link" href="/diagnosis">첫 진단 시작하기</a>
        </div>

        <!-- th:action 으로 만들어야 CSRF 토큰이 자동으로 들어간다 -->
        <form class="au-form" th:unless="${param.done}" th:action="@{/signup}" th:object="${signupRequest}" method="post" novalidate>
            <div class="au-field">
                <label class="au-label" for="nickname">닉네임</label>
                <input class="au-input" id="nickname" type="text" maxlength="12" autocomplete="nickname"
                       th:field="*{nickname}" th:attrappend="aria-invalid=${#fields.hasErrors('nickname')} ? 'true'">
                <p class="au-hint is-error" role="alert" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}">닉네임 오류</p>
                <p class="au-hint" th:unless="${#fields.hasErrors('nickname')}">2~12자, 한글·영문·숫자만 쓸 수 있습니다 (공백·특수문자 불가)</p>
            </div>
            <div class="au-field">
                <label class="au-label" for="email">이메일</label>
                <input class="au-input" id="email" type="email" autocomplete="email"
                       th:field="*{email}" th:attrappend="aria-invalid=${#fields.hasErrors('email')} ? 'true'">
                <p class="au-hint is-error" role="alert" th:if="${#fields.hasErrors('email')}">
                    <span th:errors="*{email}">이메일 오류</span>
                    <a class="au-link" href="/login" th:if="${duplicateEmail}">로그인</a>
                </p>
            </div>
            <div class="au-field">
                <label class="au-label" for="password">비밀번호</label>
                <input class="au-input" id="password" type="password" name="password" autocomplete="new-password"
                       th:attrappend="aria-invalid=${#fields.hasErrors('password')} ? 'true'">
                <p class="au-hint is-error" role="alert" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호 오류</p>
                <p class="au-hint" th:unless="${#fields.hasErrors('password')}">8~64자, 영문과 숫자를 모두 넣어 주세요 (한글·공백 제외)</p>
            </div>
            <button class="au-btn is-navy" type="submit">회원가입</button>
        </form>

        <th:block th:unless="${param.done}">
            <p class="au-links">구글·깃허브 계정으로 가입하려면 로그인 화면에서 시작하세요.</p>
            <p class="au-links">이미 회원인가요? <a class="au-link" href="/login">로그인</a></p>
        </th:block>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

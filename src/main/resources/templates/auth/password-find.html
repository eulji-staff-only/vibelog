<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 찾기 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="au-page">
<!-- U-05 비밀번호 찾기 (API-USR-11·12, #90). 가입 여부와 관계없이 보내면 "메일을 보냈습니다"(sent=true) 단계로 간다. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="au-band">
    <h1 class="au-title">비밀번호 찾기</h1>
    <p class="au-lead">가입한 이메일을 입력하면 비밀번호를 다시 정할 수 있는 링크를 보내 드립니다.</p>
</section>

<main class="au-main">
    <div class="au-panel">
        <!-- 1단계: 이메일 입력 -->
        <form class="au-form" th:unless="${param.sent}" th:action="@{/password/find}" th:object="${passwordFindRequest}" method="post" novalidate>
            <div class="au-field">
                <label class="au-label" for="email">이메일</label>
                <input class="au-input" id="email" type="email" autocomplete="email" required
                       th:field="*{email}" th:attrappend="aria-invalid=${#fields.hasErrors('email')} ? 'true'">
                <p class="au-hint is-error" role="alert" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">이메일 오류</p>
            </div>
            <button class="au-btn is-navy" type="submit">재설정 메일 받기</button>
        </form>

        <!-- 2단계: 보냈습니다. 가입 여부는 알리지 않는다 -->
        <section class="au-form" th:if="${param.sent}">
            <div class="au-notice is-success">
                <strong>메일을 보냈습니다</strong>
                <p>입력한 이메일로 가입한 계정이 있으면 재설정 링크가 도착합니다. 링크는 30분 동안 한 번만 쓸 수 있습니다.</p>
            </div>
            <a class="au-btn is-outline" href="/password/find">메일 다시 받기</a>
        </section>

        <p class="au-links">비밀번호가 생각났나요? <a class="au-link" href="/login">로그인</a></p>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

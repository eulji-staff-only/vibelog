<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${course.title()} + ' | 바이브로그'">코스 상세 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/course.css}" href="/css/course.css">
</head>
<body>
<!-- U-11 코스 상세 (FR-CRS-002, API-CRS-03, #98). CoursePageController 가 담아 주는 course(CourseDetailView)로 그린다.
     수강 상태별 버튼: 비회원 → 로그인(돌아올 곳 = 이 화면) / NONE → 수강 시작(POST /courses/{id}/enroll, FR-ENR-001)
     / ENROLLED·COMPLETED → 내 학습으로 가기. 없거나 비공개 코스는 COURSE_NOT_FOUND → E-01. -->
<div th:replace="~{common/layout :: header}"></div>

<!-- 다른 화면에서 코스 상세로 보내며 넘긴 안내 (예: 수강을 포기한 회원이 리포트를 열 때, exam #439). lesson.html 과 같은 방식 -->
<p class="vl-flash" role="status" th:if="${toast}" th:text="${toast}">알림</p>

<section class="crs-band">
    <a class="crs-back" href="/courses">← 코스 목록으로</a>
    <p class="crs-band__meta">
        <a class="crs-eyebrow" th:href="@{/tracks/{id}(id=${course.trackId()})}" th:text="${course.trackName()}">트랙</a>
        <span class="crs-eyebrow is-plain" th:text="${course.categoryName()}">카테고리</span>
    </p>
    <h1 class="crs-title" th:text="${course.title()}">코스 이름</h1>
    <p class="crs-lead" th:text="${course.summary()}">한 줄 소개</p>
</section>

<main class="crs-main">
    <div class="vl-ui-panel crs-panel">

        <div class="crs-summary">
            <dl class="crs-stats">
                <div class="crs-stat"><dt>학습 대상</dt><dd th:text="${course.target()}">학습 대상</dd></div>
                <div class="crs-stat"><dt>플랜</dt><dd th:text="${course.planDays()} + '일'">0일</dd></div>
                <div class="crs-stat"><dt>수업</dt><dd th:text="${course.lessonCount()} + '개'">0개</dd></div>
            </dl>

            <div class="crs-enroll">
                <!-- 비회원: 로그인하면 이 화면으로 돌아온다 (U-11 → U-03 redirect) -->
                <th:block sec:authorize="isAnonymous()">
                    <a th:replace="~{common/ui :: btnLink(@{/login(redirect=${'/courses/' + course.courseId()})}, '로그인하고 수강 시작', 'glow', 'xl')}">로그인하고 수강 시작</a>
                    <p class="crs-enroll__hint">로그인하면 이 코스로 돌아옵니다.</p>
                </th:block>

                <th:block sec:authorize="isAuthenticated()">
                    <th:block th:if="${course.isEnrolled()}">
                        <span th:replace="~{common/ui :: badge(${course.enrollmentStatus() == 'COMPLETED'} ? 'success' : 'strong', ${course.enrollmentStatus() == 'COMPLETED'} ? '완료' : '진행 중')}">진행 중</span>
                        <a th:replace="~{common/ui :: btnLink('/my/learning', '내 학습으로 가기', 'navy', 'xl')}">내 학습으로 가기</a>
                    </th:block>
                    <form th:unless="${course.isEnrolled()}" class="crs-enroll__form"
                          th:action="@{/courses/{id}/enroll(id=${course.courseId()})}" method="post">
                        <span th:replace="~{common/ui :: badge('neutral', '수강 전')}">수강 전</span>
                        <button th:replace="~{common/ui :: btnSubmit('수강 시작', 'glow', 'xl')}">수강 시작</button>
                        <p class="crs-enroll__hint">수강을 시작하면 첫 수업의 첫 개념이 열립니다.</p>
                    </form>
                </th:block>
            </div>
        </div>

        <section class="crs-section" aria-labelledby="crs-about-h">
            <h2 class="crs-h2" id="crs-about-h">코스 소개</h2>
            <p class="crs-body" th:text="${course.description()}">코스 소개</p>
            <h3 class="crs-h3">학습 목표</h3>
            <p class="crs-body" th:text="${course.goal()}">학습 목표</p>
        </section>

        <section class="crs-section" aria-labelledby="crs-lessons-h">
            <h2 class="crs-h2" id="crs-lessons-h">수업 목록</h2>
            <!-- 아코디언: <details> 로 열고 닫아 JS 가 필요 없다. 첫 수업만 펼쳐 둔다 -->
            <div class="crs-accordion" th:unless="${course.lessons().empty}">
                <details class="crs-lesson" th:each="lesson, stat : ${course.lessons()}" th:open="${stat.first}">
                    <summary class="crs-lesson__head">
                        <span class="crs-lesson__no" th:text="'수업 ' + ${stat.count}">수업 1</span>
                        <span class="crs-lesson__title" th:text="${lesson.title()}">수업 제목</span>
                        <span class="crs-lesson__time" th:text="'약 ' + ${lesson.estimatedMinutes()} + '분'">약 0분</span>
                    </summary>
                    <div class="crs-lesson__body">
                        <p><strong>학습 목표</strong><span th:text="${lesson.goal()}">수업 목표</span></p>
                        <p><strong>활동 구성</strong><span th:text="'개념 ' + ${lesson.conceptCount()} + ' · 퀴즈 ' + ${lesson.quizCount()}">개념 0 · 퀴즈 0</span></p>
                        <!-- 공개 수업은 모두 모의고사가 있다 (계약 ⑪, API-ADM-33) -->
                        <span th:replace="~{common/ui :: badge('neutral', '모의고사 있음')}">모의고사 있음</span>
                    </div>
                </details>
            </div>
            <th:block th:if="${course.lessons().empty}">
                <div th:replace="~{common/ui :: notice('empty', '', '아직 공개된 수업이 없습니다')}"></div>
            </th:block>
        </section>

        <section class="crs-section" aria-labelledby="crs-portfolio-h">
            <h2 class="crs-h2" id="crs-portfolio-h">모의고사와 포트폴리오</h2>
            <!-- FR-CRS-002: 수업마다 모의고사가 있고 마지막에 포트폴리오를 낸다는 안내 -->
            <div th:replace="~{common/ui :: notice('info', '수업마다 모의고사, 마지막에 포트폴리오', '수업마다 모의고사를 보고 오답 분석 리포트를 확인합니다. 모든 수업을 마치면 이 코스에서 배운 방법으로 만든 결과물을 포트폴리오로 제출하고, 제출까지 마치면 코스가 완료됩니다.')}"></div>
        </section>

        <div class="crs-actions">
            <a th:replace="~{common/ui :: btnLink(@{/tracks/{id}(id=${course.trackId()})}, '소속 트랙 보기', 'outline', '')}">소속 트랙 보기</a>
            <a th:replace="~{common/ui :: btnLink('/courses', '코스 목록으로', 'text', '')}">코스 목록으로</a>
        </div>

    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${track.name()} + ' | 바이브로그'">트랙 소개 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/course.css}" href="/css/course.css">
</head>
<body>
<!-- U-09 트랙 소개 (FR-CRS-004, API-CRS-01, #97). CoursePageController 가 담아 주는 track(TrackIntroView)으로 그린다.
     소속 공개 코스만 보여준다. 없는 트랙은 TRACK_NOT_FOUND → E-01. -->
<div th:replace="~{common/layout :: header}"></div>

<section class="crs-band">
    <a class="crs-back" href="/courses">← 코스 목록</a>
    <span class="crs-eyebrow" th:text="${track.stage()} + '단계 트랙'">2단계 트랙</span>
    <h1 class="crs-title" th:text="${track.name()}">Controller 트랙</h1>
    <p class="crs-lead" th:text="${track.target()}">대상 학습자</p>
</section>

<main class="crs-main">
    <div class="vl-ui-panel crs-panel">

        <section class="crs-section" aria-labelledby="crs-track-about">
            <h2 class="crs-h2" id="crs-track-about">이런 분께 추천해요</h2>
            <dl class="crs-facts">
                <div class="crs-fact">
                    <dt>대상 학습자</dt>
                    <dd th:text="${track.target()}">대상 학습자</dd>
                </div>
                <div class="crs-fact">
                    <dt>단계</dt>
                    <dd th:text="${track.stage()} + '단계'">2단계</dd>
                </div>
            </dl>
            <p class="crs-body" th:text="${track.description()}">트랙 설명</p>
        </section>

        <section class="crs-section" aria-labelledby="crs-track-courses">
            <div class="crs-section__head">
                <h2 class="crs-h2" id="crs-track-courses">이 트랙의 코스</h2>
                <th:block th:if="${track.firstCourse() != null}">
                    <a th:replace="~{common/ui :: btnLink(@{/courses/{id}(id=${track.firstCourse().courseId()})}, '첫 코스 보기', 'navy', '')}">첫 코스 보기</a>
                </th:block>
            </div>
            <ul class="crs-cards" th:unless="${track.courses().empty}">
                <li th:each="card : ${track.courses()}">
                    <a th:replace="~{course/list :: courseCard(${card})}">코스 카드</a>
                </li>
            </ul>
            <th:block th:if="${track.courses().empty}">
                <div th:replace="~{common/ui :: notice('empty', '', '아직 공개된 코스가 없습니다')}"></div>
            </th:block>
        </section>

    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

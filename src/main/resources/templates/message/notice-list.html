<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공지사항 | 바이브로그</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/message.css}">
</head>
<body>
<!-- U-25 공지 목록 (API-NTF-04, #186). 최신순 10개씩. 회원만 (비회원은 로그인으로) -->
<div th:replace="~{common/layout :: header}"></div>

<section class="ms-band">
    <h1 class="ms-title">공지사항</h1>
</section>

<main class="ms-main">
    <div class="ms-panel">
        <ul class="ms-list" th:unless="${notices.empty}">
            <li th:each="n : ${notices.content}">
                <a class="ms-item" th:href="@{/notices/{id}(id=${n.noticeId()})}">
                    <span class="ms-item__title" th:text="${n.title()}">공지 제목</span>
                    <time th:datetime="${n.createdAt()}" th:text="${#temporals.format(n.createdAt(), 'yyyy.MM.dd')}">2026.11.09</time>
                </a>
            </li>
        </ul>
        <p class="ms-muted" th:if="${notices.empty}">등록된 공지사항이 없습니다</p>

        <nav class="ms-pages" aria-label="페이지" th:if="${notices.totalPages > 1}"
             th:with="current=${notices.number + 1},
                      start=${T(java.lang.Math).max(1, current - 4)},
                      end=${T(java.lang.Math).min(notices.totalPages, start + 9)}">
            <a th:each="p : ${#numbers.sequence(start, end)}" th:href="@{/notices(page=${p})}"
               th:attr="aria-current=${p == current} ? 'page'" th:text="${p}">1</a>
        </nav>
    </div>
</main>

<div th:replace="~{common/layout :: footer}"></div>
</body>
</html>

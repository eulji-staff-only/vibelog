name: "🐛 버그 제보"
description: "의도대로 동작하지 않는 문제를 발견했을 때 사용합니다."
title: "[버그] "
labels: ["🐛 bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 버그를 알려 주셔서 고마워요 🙏
        - **다른 사람이 똑같이 따라 했을 때 버그가 재현되도록** 적어 주는 것이 가장 중요합니다.
        - 이슈를 만든 뒤 오른쪽 사이드바에서 **Labels(part / area / 우선순위)** 와 **Projects** 를 설정해 주세요.

  - type: textarea
    id: description
    attributes:
      label: "🐞 어떤 문제인가요?"
      description: "버그를 한두 문장으로 설명해 주세요."
      placeholder: "예) 로그인한 상태에서 새로고침하면 로그아웃된다."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔁 재현 방법"
      description: "버그가 나타나기까지의 순서를 적어 주세요."
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "🙆 기대한 동작"
      placeholder: "예) 새로고침해도 로그인 상태가 유지된다."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "🙅 실제 동작"
      placeholder: "예) 로그인 화면으로 이동하고 다시 로그인해야 한다."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "📸 스크린샷 / 영상"
      description: "이미지나 영상을 이 칸에 드래그해서 붙여넣을 수 있어요."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "📋 에러 메시지 / 로그"
      description: "콘솔이나 터미널의 에러 메시지를 텍스트로 붙여넣어 주세요. (API 키·비밀번호는 지우고!)"
      render: shell
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: "💻 발생 환경"
      placeholder: "예) Chrome 130 / macOS, develop 브랜치 최신 (a1b2c3d)"
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: "🔥 심각도"
      description: "고른 값에 맞춰 오른쪽 Labels에서 우선순위 라벨(P0~P3)도 붙여 주세요."
      options:
        - "P0 · 서비스를 쓸 수 없음 / 발표·배포를 막음"
        - "P1 · 핵심 기능이 동작하지 않음"
        - "P2 · 불편하지만 다른 방법으로 사용 가능"
        - "P3 · 사소한 문제 (오타, 미세한 화면 깨짐)"
    validations:
      required: true

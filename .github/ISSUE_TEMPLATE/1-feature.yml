name: "✨ 기능 개발"
description: "요구사항 명세서(FR-…)에 있는 기능을 구현할 때 사용합니다."
title: "[기능] "
labels: ["✨ feature"]
body:
  - type: markdown
    attributes:
      value: |
        ### 작성 전에 확인해 주세요 👀
        - 구현할 기능은 **[요구사항 명세서](https://github.com/eulji-staff-only/vibelog/blob/develop/docs/planning/06-requirements.md)** 에서 ID(`FR-LSN-006` 등)를 찾아 시작합니다. 숫자 기준(횟수·기간·통과 기준)은 **[정책 정의서](https://github.com/eulji-staff-only/vibelog/blob/develop/docs/planning/07-policy.md)** 의 `PL-…` 를 따릅니다.
        - 명세서에 없는 기능이거나 명세와 다르게 만들어야 한다면, 먼저 **📐 요구사항 변경 요청** 양식으로 팀 승인을 받아 주세요.
        - **1~3일 안에 끝낼 수 있는 크기**로 쪼개 주세요. 보통 `FR` 1~3개가 이슈 하나입니다.
        - 이슈를 만든 뒤 오른쪽 사이드바에서 **Assignees · Labels(part / area / 우선순위) · Projects · Milestone** 을 설정해 주세요.

  - type: input
    id: fr
    attributes:
      label: "📋 요구사항 ID"
      description: "이 이슈로 구현하는 요구사항 ID. 여러 개면 쉼표로 구분합니다. 비기능(NFR)도 함께 적어 주세요."
      placeholder: "예) FR-LSN-006, FR-LSN-007"
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: "🗂️ 업무"
      description: "요구사항 ID의 업무 코드입니다. 여러 개 고를 수 있습니다."
      multiple: true
      options:
        - "USR · 회원"
        - "DGN · 진단·추천"
        - "CRS · 트랙·카테고리·코스"
        - "ENR · 수강"
        - "LSN · 수업 (개념·퀴즈)"
        - "EXM · 모의고사·오답 리포트"
        - "PRT · 포트폴리오"
        - "CMT · 커뮤니티 (게시판)"
        - "CTS · 월간 콘테스트"
        - "RWD · 보상 (배지)"
        - "REV · 동료 리뷰"
        - "MSG · 쪽지"
        - "RPT · 신고"
        - "NTF · 알림·공지"
        - "ADM · 백오피스 공통"
    validations:
      required: true

  - type: dropdown
    id: spec_priority
    attributes:
      label: "🎯 명세서 우선순위"
      description: "요구사항 명세서의 우선순위 칸 값입니다. (작업 긴급도 라벨 P0~P3와는 다릅니다)"
      options:
        - "P1 (Must) · 메인 흐름, 없으면 오픈 불가"
        - "P2 (Should) · 보조 기능"
        - "P3 (Could) · 고도화"
    validations:
      required: true

  - type: dropdown
    id: part
    attributes:
      label: "🧩 파트"
      options:
        - "FE + BE"
        - "FE"
        - "BE"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "📌 개요"
      description: "무엇을 만드는지 한두 문장으로 적어 주세요."
      placeholder: "예) 퀴즈 화면에서 문항마다 확인하며 풀고, 제출하면 채점해 정답률 50% 이상이면 통과 처리한다."
    validations:
      required: true

  - type: textarea
    id: policy
    attributes:
      label: "📏 적용할 정책"
      description: "이 기능이 지켜야 할 정책 ID와 값. 구현할 때 숫자를 여기서 확인합니다."
      placeholder: |
        예)
        - PL-LSN-002 퀴즈 통과 기준: 정답률 50% 이상
        - PL-LSN-006 확인한 문항은 답 고정
    validations:
      required: false

  - type: textarea
    id: screens
    attributes:
      label: "🖥️ 화면 · 이벤트"
      description: "관련 화면과 이벤트 스토밍 번호(E3-2, A1-1 등)를 적어 주세요."
      placeholder: |
        예)
        - 화면: 수업 화면 → 퀴즈 화면 → 수업 화면
        - 이벤트: E3-2 개념 읽기 완료, E3-3 퀴즈 확인·제출, E3-5 다음 개념 열림
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: "🛠️ 작업 목록"
      description: "파트별로 쪼개 주세요. 진행하면서 하나씩 체크합니다."
      value: |
        **BE**
        - [ ] 엔티티 · 테이블
        - [ ] API
        - [ ] 권한 체크 (비회원 / 학습자 / 운영자)

        **FE**
        - [ ] 화면
        - [ ] API 연동

        **공통**
        - [ ] 예외 · 에러 메시지 처리 (PL-ERR-001~006)
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: "✅ 완료 조건"
      description: "명세서 상세 설명과 정책 값을 기준으로, 리뷰어가 직접 확인할 수 있게 적어 주세요. 실패·예외 상황도 하나 이상 넣어 주세요."
      placeholder: |
        예)
        - 정답률 50% 이상으로 제출하면 다음 개념이 열리고 수업 화면으로 돌아간다.
        - 50% 미만이면 개념 다시 보기 / 다시 풀기를 고를 수 있고 이전 점수가 보인다.
        - 확인을 누른 문항은 답을 바꿀 수 없다.
    validations:
      required: true

  - type: textarea
    id: depends
    attributes:
      label: "🔗 선행 이슈 · 참고"
      description: "명세서의 의존성 칸에 있는 요구사항의 이슈(#번호), 디자인 링크 등을 적어 주세요. 선행 이슈가 안 끝났으면 `⛔ blocked` 라벨을 붙여 주세요."
      placeholder: "예) #12 (FR-LSN-001 수업 화면), #15 (FR-LSN-012 퀴즈 문항 등록)"
    validations:
      required: false

# PR마다 빌드·테스트를 돌려 결과(✅/❌)를 PR 화면에 표시한다.
# ❌ 인 PR은 머지하지 않는다. (비공개 무료 저장소라 GitHub이 머지를 막아 주지 않는다)
name: build

on:
  pull_request:
  push:
    branches: [develop, main]

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소해 Actions 사용 시간을 아낀다
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vibelog
          MYSQL_USER: vibelog
          MYSQL_PASSWORD: vibelog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # DB 스크립트(01-schema.sql 등)가 있으면 순서대로 실행한다. SQL 문법 오류도 여기서 잡힌다.
      # 00-create-database.sql 은 위 mysql 서비스가 대신하므로 건너뛴다.
      - name: Run SQL scripts
        run: |
          for f in sql/0[1-9]*.sql; do
            [ -e "$f" ] || continue
            echo "▶ $f"
            mysql -h 127.0.0.1 -u root -proot vibelog < "$f"
          done

      - name: Build
        run: ./gradlew build

# 연결한 이슈의 마일스톤이 바뀌면(P1 이 되거나 빠지면) 그 이슈를 본문에 연결한 열린 PR 의 area-review 를 다시 돌린다 (#287).
# area-review 는 PR 이벤트로만 돌아서, 이슈 쪽 변경은 이 워크플로가 이어 준다. 다시 돌리는 방식은 area-review-rerun.yml 과 같다 (#130).
name: area-review-issue

on:
  issues:
    types: [milestoned, demilestoned]

permissions:
  actions: write
  pull-requests: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run area-review of open PRs linking this issue
        run: |
          prs=$(gh pr list -R "$REPO" --state open --limit 200 --json number,body \
            --jq '.[] | select((.body // "") | test("(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?|part of|refs?) #" + $ENV.ISSUE + "([^0-9]|$)")) | .number')
          if [ -z "$prs" ]; then echo "이슈 #$ISSUE 를 연결한 열린 PR 이 없습니다"; exit 0; fi
          for pr in $prs; do
            sha=$(gh pr view "$pr" -R "$REPO" --json headRefOid --jq .headRefOid)
            id=$(gh api "repos/$REPO/actions/workflows/area-review.yml/runs?event=pull_request&head_sha=$sha" \
                   --jq "[.workflow_runs[] | select(any(.pull_requests[]; .number == $pr))][0].id // empty")
            if [ -z "$id" ]; then echo "#$pr: 다시 돌릴 area-review 실행이 없습니다"; continue; fi
            gh run watch "$id" -R "$REPO" > /dev/null || true   # 아직 도는 중이면 끝날 때까지 기다린다
            gh run rerun "$id" -R "$REPO" && echo "#$pr: area-review 실행 $id 을 다시 돌렸습니다"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
